<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTasks</title>
    <link rel="stylesheet" href="./css/index.css" />
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="app">
      <div
        data-hx-trigger="load"
        data-hx-swap="outerHTML"
        data-hx-get="index.sidebar.partial.html"
      ></div>
      <div
        data-hx-trigger="load"
        data-hx-swap="outerHTML"
        data-hx-get="index.main.partial.html"
      ></div>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <div class="modal" id="listModal">
      <div class="modal__content">
        <h2 class="modal__title">Новий список</h2>

        <input
          type="text"
          class="modal__input"
          id="listNameInput"
          placeholder="Наприклад: Спорт"
        />

        <div class="modal__actions">
          <button
            class="modal__button modal__button--cancel"
            id="closeListModal"
          >
            Скасувати
          </button>

          <button
            class="modal__button modal__button--create"
            id="createListButton"
          >
            Створити
          </button>
        </div>
      </div>
    </div>
    <script>
      lucide.createIcons();
    </script>
    <script src="./js/main.js"></script>
  </body>
</html>
