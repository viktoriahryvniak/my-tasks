<main class="main">
  <header class="main__header">
    <div class="main__title-wrapper">
      <h2 class="main__title">Сьогодні</h2>

      <span class="main__icon">✨</span>
    </div>

    <div class="main__actions">
      <button class="main__icon-button main__filter-button" type="button">
        <i data-lucide="sliders-horizontal"></i>
      </button>
      <button class="main__icon-button theme-toggle" type="button">🌙</button>
    </div>
  </header>

  <section class="task-input">
    <form class="task-input__form">
      <input
        type="text"
        class="task-input__field"
        placeholder="Додати нову справу..."
      />

      <button class="task-input__button">+ Додати</button>
    </form>
  </section>

  <section class="filters">
    <button class="filters__button filters__button--active" data-filter="all">
      All
    </button>

    <button class="filters__button" data-filter="active">Active</button>

    <button class="filters__button" data-filter="completed">Completed</button>

    <button class="filters__button" data-filter="important">Important</button>
  </section>

  <section class="tasks">
    <ul class="tasks__list"></ul>
    <p class="tasks__empty">✨ Немає задач. Додай свою першу ціль!</p>
  </section>

  <section class="progress">
    <div class="progress__card">
      <div class="progress__top">
        <p class="progress__label">Daily Progress</p>

        <span class="progress__emoji"> 🚀 </span>
      </div>

      <h3 class="progress__title">0 / 0 Completed</h3>

      <p class="progress__text">
        Ти вже чудово рухаєшся до своїх цілей сьогодні.
      </p>

      <div class="progress__bar">
        <div class="progress__line"></div>
      </div>
    </div>
  </section>
  <section class="prediction">
    <button class="prediction__button" type="button">
      ✨ Відкрити передбачення
    </button>

    <div class="prediction__card">
      <p class="prediction__text"></p>
    </div>
  </section>
</main>
